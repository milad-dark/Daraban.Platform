; =============================================================================
; pgBouncer configuration — Daraban Platform (Task 8.2)
; =============================================================================
; Deployment procedure lives in docs/07-Performance.md. This file is mounted
; read-only into the pgbouncer container at /etc/pgbouncer/pgbouncer.ini.
;
; Daraban talks to pgBouncer (port 6432) instead of Postgres (port 5432):
;   ConnectionStrings__Postgres = Host=pgbouncer;Port=6432;Database=daraban_platform;Username=daraban;Password=...
;
; Npgsql keeps its own small client pool (MaxPoolSize=25 default). pgBouncer
; absorbs the *server-side* connection cost for bursts and for the several
; worker/host processes that share one database.

[databases]
; Migrations and DDL run against the *direct* Postgres port (5432), never
; through the pooler — transaction pooling would break prepared statements.
daraban_platform = host=postgres port=5432 dbname=daraban_platform

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; TLS is terminated by nginx for HTTP traffic; within the compose network the
; DB hop is trusted. Enable server_tls=1 when Postgres requires TLS.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; ---- Pool sizing -------------------------------------------------------------
; Transaction pooling is the big win for EF Core: one server connection serves
; many client requests. Daraban does not rely on session-scoped server state
; (no LISTEN/NOTIFY, no advisory locks). Npgsql sends few prepared statements
; by default; if EnablePrepareDatabaseQueries is ever turned on in the
; connection string, switch pool_mode to session or set max_prepared_statements.
pool_mode = transaction

; Keep the pool BELOW postgres.max_connections to leave headroom for the
; superuser reservation and direct-connection migrations.
max_client_conn = 400
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; ---- Safety valves -----------------------------------------------------------
server_idle_timeout = 600
server_lifetime = 3600
query_timeout = 60
idle_transaction_timeout = 10

; Drain gracefully on RELOAD/restart so in-flight exports are not cut off.
suspend_timeout = 30

; ---- Logging -----------------------------------------------------------------
stats_period = 60
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; Admin console (SHOW POOLS / SHOW STATS) restricted to pooler's own db:
;   docker exec -it daraban-pgbouncer psql -p 6432 -U daraban pgbouncer -c "SHOW POOLS;"
admin_users = daraban
stats_users = daraban
