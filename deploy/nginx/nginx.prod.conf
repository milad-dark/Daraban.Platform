# =============================================================================
# Daraban Platform — edge reverse proxy, PRODUCTION (Task 8.4).
# Mounted by docker-compose.prod.yml at /etc/nginx/conf.d/default.conf.
#
# Same routing contract as docker/nginx.conf (full paths preserved, agent blocks
# win by longest prefix) PLUS, in this file only:
#   - :80 serves ACME challenges and redirects everything else to :443
#   - :443 terminates TLS with Mozilla-intermediate settings (1.2+ only)
#   - per-IP rate limits on the credential-attack surface (login/token/refresh)
#   - gzip for JSON/text, security headers, server_tokens off
#
# What this file deliberately does NOT do:
#   - route /metrics anywhere (Prometheus scrapes host-api:8080/metrics and
#     host-agentapi:8081/metrics over the internal compose network; the public
#     edge must never expose them -- see PrometheusMetricsExtensions.cs),
#   - publish Grafana/Prometheus/Uptime Kuma (no server blocks for them at all;
#     reach them over SSH tunnels per docs/10-Backup-Restore-Runbook.md).
#
# NOTE ON server_name AND CERT PATHS: this file contains NO environment
# variables on purpose. nginx does not expand ${VAR} in config files, and the
# docker image's envsubst templating would ALSO rewrite nginx's own $variables
# ($host, $remote_addr, ...) -- a classic footgun. Instead:
#   server_name is "_" (single-site host: SNI matching is irrelevant), and
#   the certificate paths point at /etc/letsencrypt/live/current/, which
#   init-letsencrypt.sh symlinks to live/<DOMAIN>/ after issuance. Renewals
#   happen in place under live/<DOMAIN>/, so the symlink never goes stale.
# =============================================================================

# ---- Rate-limit zones (shared memory, sized for one host) ----
# 10 login/register/refresh attempts per minute per IP mirrors the in-app
# fixed-window "auth" policy (Program.cs) -- edge and app enforce the same
# budget, so neither is a single point of bypass.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# Agent token endpoint: machines, not browsers -- generous but bounded.
limit_req_zone $binary_remote_addr zone=agent_auth:10m rate=60r/m;
# General API safety net against a runaway client (polling loops, broken retry).
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

upstream backend_api {
    server host-api:8080;
    keepalive 32;
}

upstream agent_api {
    server host-agentapi:8081;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
    keepalive 32;
}

# ---- ACME challenge + HTTP->HTTPS redirect. Nothing else answers on :80. ----
server {
    listen 80;
    server_name _;

    # Certbot webroot plugin writes here (shared certbot-webroot volume);
    # everything else redirects. This location MUST stay reachable over plain
    # HTTP or renewals fail closed and TLS expires.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Everything real happens on :443. ----
server {
    listen 443 ssl;
    server_name _;

    # Via the "current" symlink (see header note): full chain first, because some
    # older agents fail closed on a bare cert without intermediates.
    ssl_certificate /etc/letsencrypt/live/current/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/current/privkey.pem;

    # Mozilla intermediate profile: TLS 1.2 floor (1.0/1.1 carry known breaks),
    # no NULL/EXPORT/DES/3DES/RC4/MD5, server cipher preference so a weak
    # client offer cannot negotiate the connection down.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;
    client_max_body_size 50M;

    # HSTS: once a browser has seen this header it refuses plain-HTTP for a
    # year, including subdomains. Only safe BECAUSE :80 redirects everything;
    # do not enable this server block on a host that still serves HTTP content.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No inline scripts/styles anywhere in the Angular bundle contract; if the
    # frontend ever needs inline code, this header -- not its removal -- gets
    # renegotiated with a nonce/hash first.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'self'" always;

    # gzip: JSON/text only. Pre-compressed assets (.br/.gz from the Angular
    # build) pass through untouched; images/fonts are already compressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json text/plain text/css application/javascript text/xml application/xml;

    # /metrics must never be served by the edge in ANY form -- not even the SPA
    # fallback (which would answer 200 with index.html and make "is metrics
    # exposed?" unanswerable by status code). Exact match only: Prometheus
    # scrapes precisely this path internally; anything else falls through to /.
    location = /metrics {
        return 404;
    }

    # ---- Credential endpoints: strictest limits, explicit 429 overflow ----
    # burst allows a double-click/login+refresh pair through; nodelay keeps
    # interactive latency flat instead of queueing the burst out.
    location /api/v1/identity/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/v1/agents/auth {
        limit_req zone=agent_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://agent_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ---- AgentApi-owned API paths (longest prefix wins over /api/ below) ----
    location /api/v1/agents/ {
        limit_req zone=api burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://agent_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/agent/ {
        limit_req zone=api burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://agent_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- General API on host-api ----
    location /api/ {
        limit_req zone=api burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- SignalR: agent-control lives on AgentApi, the rest on host-api ----
    location /hubs/agent-control/ {
        proxy_pass http://agent_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    location /hubs/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # ---- Angular SPA ----
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
