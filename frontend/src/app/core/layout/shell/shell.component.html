<mat-sidenav-container class="shell-container">

  <mat-sidenav #sidenav mode="side" opened class="shell-sidenav">

    <div class="sidenav-brand">
      <mat-icon class="brand-icon">shield</mat-icon>
      <span class="brand-name">Daraban</span>
    </div>

    <mat-divider />

    <mat-nav-list>
      @for (item of navItems; track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

  </mat-sidenav>

  <mat-sidenav-content class="shell-content">

    <mat-toolbar class="shell-toolbar" color="primary">
      <span class="flex-spacer"></span>
      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="user-menu-header">
          <span class="user-name">{{ authStore.fullName() }}</span>
          <span class="user-email">{{ authStore.currentUser()?.email }}</span>
        </div>
        <mat-divider />
        <button mat-menu-item>
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item>
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <mat-divider />
        <button mat-menu-item (click)="onLogout()">
          <mat-icon>logout</mat-icon>
          <span>Sign out</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="shell-page-content">
      <router-outlet />
    </div>

  </mat-sidenav-content>

</mat-sidenav-container>
