# =============================================================================
# CD — push to master or manual dispatch
#   build-images: docker build + push 6 images to Docker Hub, tagged SHA + latest
#   deploy:       SSH to server, flip DARABAN_TAG in .env, compose pull +
#                 rolling `up -d --no-deps`, health gate, rollback on failure
#
# Required repository secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# Deploy job additionally needs DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
#   (optional DEPLOY_PATH, default /opt/daraban) AND repository variable DEPLOY_ENABLED=true;
#   without them the deploy job is skipped (images still publish to Docker Hub).
# =============================================================================
name: CD

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-images:
    name: Build & push (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: daraban-api,                dockerfile: docker/host-api.Dockerfile,             context: . }
          - { image: daraban-agentapi,           dockerfile: docker/host-agentapi.Dockerfile,        context: . }
          - { image: daraban-worker-automation,  dockerfile: docker/worker-automation.Dockerfile,    context: . }
          - { image: daraban-worker-notifications, dockerfile: docker/worker-notifications.Dockerfile, context: . }
          - { image: daraban-worker-reporting,   dockerfile: docker/worker-reporting.Dockerfile,     context: . }
          - { image: daraban-frontend,           dockerfile: docker/frontend.Dockerfile,             context: ./frontend }
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-images
    # Skipped until a production server exists: enable with
    #   gh variable set DEPLOY_ENABLED --body true
    # (job-level `if` cannot read secrets, hence the variable gate + DEPLOY_* secrets).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: SSH deploy (rolling update with rollback)
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/daraban' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,GITHUB_SHA
          script: |
            set -e
            cd "${DEPLOY_PATH:-/opt/daraban}"

            # Load NGINX_PORT etc. from the server .env
            set -a; . ./.env; set +a

            # Remember the currently deployed tag for rollback
            PREV_TAG="$(grep '^DARABAN_TAG=' .env | cut -d= -f2 || true)"
            PREV_TAG="${PREV_TAG:-latest}"
            NEW_TAG="${GITHUB_SHA}"
            echo "Deploying tag ${NEW_TAG} (rollback tag: ${PREV_TAG})"

            APP_SERVICES="host-api host-agentapi worker-automation worker-notifications worker-reporting worker-reports frontend"

            # Pin the new tag and pull the new images
            sed -i "s/^DARABAN_TAG=.*/DARABAN_TAG=${NEW_TAG}/" .env
            docker compose pull ${APP_SERVICES}

            wait_healthy() {
              name="$1"
              for i in $(seq 1 24); do
                s="$(docker inspect -f '{{.State.Health.Status}}' "$name" 2>/dev/null || echo unknown)"
                [ "$s" = "healthy" ] && return 0
                sleep 5
              done
              return 1
            }

            gateway_ok() {
              curl -fsS -o /dev/null "http://localhost:${NGINX_PORT:-80}/"
            }

            deploy_stack() {
              tag="$1"
              sed -i "s/^DARABAN_TAG=.*/DARABAN_TAG=${tag}/" .env
              docker compose pull ${APP_SERVICES}
              # Rolling update, one service at a time, gated on health
              docker compose up -d --no-deps host-api
              wait_healthy daraban-host-api || return 1
              docker compose up -d --no-deps host-agentapi
              wait_healthy daraban-host-agentapi || return 1
              docker compose up -d --no-deps worker-automation worker-notifications worker-reports
              docker compose up -d --no-deps frontend
              for i in $(seq 1 12); do gateway_ok && return 0; sleep 5; done
              return 1
            }

            if deploy_stack "${NEW_TAG}"; then
              echo "Deploy of ${NEW_TAG} succeeded"
              exit 0
            fi

            echo "Health gate FAILED — rolling back to ${PREV_TAG}"
            deploy_stack "${PREV_TAG}" || echo "Rollback also reported problems — investigate manually"
            exit 1
