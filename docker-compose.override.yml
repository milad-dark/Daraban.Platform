# Development overrides
services:
  host-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "${HOST_API_PORT:-5000}:8080"
    volumes:
      - ./certs:/app/certs:ro
#
  host-agentapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8081
    ports:
      - "${HOST_AGENTAPI_PORT:-5001}:8081"
    volumes:
      - ./certs:/app/certs:ro
#
  worker-automation:
    environment:
      - DOTNET_ENVIRONMENT=Development
    volumes:
      - ./certs:/app/certs:ro
#
  worker-notifications:
    environment:
      - DOTNET_ENVIRONMENT=Development
    volumes:
      - ./certs:/app/certs:ro
#
  worker-reporting:
    environment:
      - DOTNET_ENVIRONMENT=Development
    volumes:
      - ./certs:/app/certs:ro
#
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
#
  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"
#
  rabbitmq:
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
#
  nginx:
    ports:
      - "${NGINX_PORT:-80}:80"
#
  frontend:
    build:
      target: dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/angular.json:/app/angular.json
    ports:
      - "4200:4200"
