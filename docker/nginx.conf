# =============================================================================
# Daraban Platform — edge reverse proxy (local/dev compose).
#
# ROUTING CONTRACT (Task 8.4 fix — read before touching):
# Backend controller routes all START WITH the api/ prefix
# (api/v1/identity/auth, api/v1/assets, api/agent/inventory, ...), and clients
# (browser SPA, machine agents) call those exact paths. Therefore every
# proxy_pass below forwards the FULL original path UNCHANGED
# (proxy_pass with NO trailing-slash URI). The previous version used
# "proxy_pass http://backend_api/;" which strips the matched /api/ prefix, so
# /api/v1/tickets arrived upstream as /v1/tickets and EVERY route 404'd.
#
# Host split: most /api/* lives on host-api, but everything the AgentApi serves
# (api/v1/agents/* incl. agent auth, api/agent/* for machine agents) must reach
# host-agentapi. nginx picks the LONGEST matching prefix, so the two explicit
# agent blocks below win over the general /api/ block. There is deliberately
# NO stripped /agent/ location: no client constructs such URLs (AGENT_KNOWLEDGE
# documents /api/agent/... throughout), and a stripping block can only 404.
# =============================================================================

upstream backend_api {
    server host-api:8080;
}

upstream agent_api {
    server host-agentapi:8081;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # /metrics is an internal scrape path (host-api:8080, host-agentapi:8081,
    # worker-*:9102 over the compose network). Answering it here -- even with
    # the SPA fallback's 200+index.html -- would make "is metrics exposed?"
    # unanswerable by status code. Exact match only, both confs.
    location = /metrics {
        return 404;
    }

    # ---- Machine agents + admin agent UI: AgentApi owns api/v1/agents/* AND api/agent/*.
    # Longest-prefix match wins over the general /api/ block below. Full path preserved.
    location /api/v1/agents/ {
        proxy_pass http://agent_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Inventory payloads are the largest bodies in the system.
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/agent/ {
        proxy_pass http://agent_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- Everything else under /api/ lives on host-api. Full path preserved.
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- SignalR: server->agent push lives on AgentApi, everything else on host-api.
    # The specific block must come first for readability (nginx picks longest prefix
    # regardless of order, but readers shouldn't have to know that).
    location /hubs/agent-control/ {
        proxy_pass http://agent_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A hub connection lives for hours; the defaults (60s) would kill it silently.
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    location /hubs/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # ---- Angular SPA (its own inner nginx handles try_files -> index.html).
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
